<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tab Decoder · TabTranslator Pro</title>
  <meta name="description" content="Turn guitar tablature into chord symbols. Paste ASCII tab or upload a digital tab PDF." />
  <meta name="color-scheme" content="dark" />

  <!--
    Static host, two boot paths (audit 2026-11-18 M4 — no third-party host can stop or reach the app):
    · DEPLOYED (GitHub Pages): pages.yml transpiles engine.tsx + TabDecoderPro.tsx ONCE at deploy time
      (scripts/build_app.mjs, the same Babel presets) into build/, and stamps window.__TTP_BUILD__ below.
      The page imports build/app.js; Babel is never downloaded.
    · DEVELOPMENT (the repo served as-is): no stamp → the loader fetches the sources, downloads Babel
      standalone (SRI-pinned) and transpiles in the browser, as before.
    React 18.3.1 is vendored same-origin (vendor/react-18.3.1/, the npm release's UMD production files,
    SHA-256 pinned by npm test) and exposed to the app's `import … from "react"` through a small ESM shim
    over window.React — one React instance, no esm.sh, no import map (a Blob-URL module graph doesn't
    inherit import maps in WebKit / Safari < 16.4 anyway).
  -->
  <!-- first so the dark splash paints before any script arrives (perf audit 2026-11-26) -->
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0f; }
    #root { min-height: 100%; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #9aa0a6; background: #0b0b0f;
      font: 14px/1.6 ui-monospace, "IBM Plex Mono", monospace;
      text-align: center; padding: 24px;
    }
    #boot b { color: #ff6b35; font-weight: 600; }
    #boot code { color: #e06c75; }
  </style>

  <!--
    Web fonts (cosmetic): requested from <head> so the font files download while the app loads, instead of
    from an @import the app rendered (found only after ~1.4 MB of JS had run). media="print" + onload =
    the stylesheet never blocks the first paint; display=swap shows the system monospace until it lands.
    IBM Plex Mono 500 is gone: no text used it.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" /></noscript>

  <script>window.__TTP_BUILD__ = "";</script>
  <!--
    defer (perf audit 2026-11-26): React no longer blocks the parser, so the splash paints at once. Deferred
    classic scripts and module scripts run in document order, so React is still in place before the boot
    module at the end of <body> runs.
  -->
  <script defer src="./vendor/react-18.3.1/react.production.min.js"></script>
  <script defer src="./vendor/react-18.3.1/react-dom.production.min.js"></script>
  <!--
    The optional model glue below is async (perf audit 2026-11-26): each module only installs a window.TTP_*
    function that the UI reads when a button is pressed, so none of them may hold up the app's boot module.
  -->
  <!--
    Optional per-voice ML note transcription (Spotify basic-pitch). Deferred +
    lazy-init: this module only downloads the model + tfjs from esm.sh the first
    time the user taps "🎼 Voices (ML)" in the Audio panel. Load failure is
    silent — the UI's "not configured" message stays honest. See note-model.js.
  -->
  <script type="module" async src="./note-model.js"></script>
  <!--
    Optional full-mix stem separation (SCNet, MIT weights) for the Audio panel's
    "✂ Split this mix into stems". Lazy: nothing downloads until the first split;
    the separation runs in a module Worker (stem-worker.js). See stem-model.js.
  -->
  <script type="module" async src="./stem-model.js"></script>
  <!--
    Optional guitar note transcription (🎸 Guitar → Tab): the guitar CRNN (MIT) as a 25 MB
    same-origin ONNX model, run on the pinned ONNX Runtime Web build in a module Worker that
    imports this page's engine. Nothing is fetched until the button is pressed. See guitar-model.js.
  -->
  <script type="module" async src="./guitar-model.js"></script>
  <!--
    Optional drum transcription model (stems panel → drums chart): Magenta Onsets & Frames drums
    (Apache-2.0, trained on E-GMD) as a 4.9 MB same-origin ONNX model on the same pinned runtime, in
    a module Worker that imports this page's engine. Nothing is fetched until a drums stem is
    charted with the drum model on. See drum-model.js.
  -->
  <script type="module" async src="./drum-model.js"></script>
  <!--
    Optional chord-symbol reader ("Scan 📷": a photo or scanned PDF of a lead sheet → chord chart):
    our own small CTC recogniser (~0.6 M parameters, trained on synthetic chord images) as a
    same-origin ONNX model on the same pinned runtime, in a module Worker that imports this page's
    engine. Nothing is fetched until a page is read. See chord-ocr-model.js.
  -->
  <script type="module" async src="./chord-ocr-model.js"></script>
  <!--
    Optional learned beat + downbeat tracker ("Tempo & bars" → 🥁 Find bar 1 (ML)): beat_this
    (CPJKU, MIT) as a 22.5 MB same-origin ONNX model on the same pinned runtime, in a module Worker
    that imports this page's engine. Nothing is fetched until the button is pressed. See beat-model.js.
  -->
  <script type="module" async src="./beat-model.js"></script>
  <!--
    Tab viewer (ChartPanel's "Tab" view + opening a saved .alphatex): alphaTab 1.8.4 (MPL-2.0),
    vendored same-origin in vendor/alphatab-1.8.4/ so its render worker and audio worklet load.
    Nothing is fetched until a tab is first shown. See tab-view.js.
  -->
  <script type="module" async src="./tab-view.js"></script>

</head>
<body>
  <div id="root"></div>
  <div id="boot"><div><b>TAB·DECODER</b><br/>loading engine…</div></div>

  <script type="module">
    const boot = document.getElementById("root");
    const splash = document.getElementById("boot");
    const fail = (msg, detail) => {
      splash.innerHTML =
        '<div><b>TAB·DECODER</b><br/>could not start<br/><br/>' +
        msg + (detail ? '<br/><code>' + String(detail).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</code>' : '') +
        '<br/><br/>Reload to try again. (A development copy also needs unpkg.com to transpile ' +
        'its source in the browser.)</div>';
    };

    // ESM view of the vendored UMD React, for the app's `import React, { … } from "react"` (dev path;
    // the deployed build ships the same shim as build/react-shim.js).
    const BABEL_URL = "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js";
    const BABEL_SRI = "sha384-EIcs2MbARRLcLs7Gv2wqqhhfMlcLeW9yuJsWki1r5iveN1F5gpzHOwAKycJqSQOI";
    const blobUrl = (src) => URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    const reactShim = (R) => "const R = window.React;\nexport default R;\n" +
      Object.keys(R).filter((k) => /^[A-Za-z_$][\w$]*$/.test(k)).map((k) => "export const " + k + " = R." + k + ";").join("\n");
    const loadBabel = () => new Promise((resolve, reject) => {
      if (window.Babel) { resolve(); return; }
      const s = document.createElement("script");
      s.src = BABEL_URL; s.integrity = BABEL_SRI; s.crossOrigin = "anonymous";
      s.onload = () => resolve(); s.onerror = () => reject(new Error("Babel standalone failed to load from unpkg.com (or did not match its pinned hash)"));
      document.head.appendChild(s);
    });

    try {
      const React = window.React, ReactDOM = window.ReactDOM;
      if (!React || !ReactDOM || !ReactDOM.createRoot) throw new Error("React failed to load from vendor/react-18.3.1/");
      let TabDecoderPro;

      if (window.__TTP_BUILD__) {
        // DEPLOYED: prebuilt at deploy time — same-origin modules, stamped with the commit.
        const v = "?v=" + encodeURIComponent(window.__TTP_BUILD__);
        window.__TTP_ENGINE_URL__ = new URL("./build/engine.js" + v, location.href).href;
        ({ default: TabDecoderPro } = await import("./build/app.js" + v));
      } else {
        // DEVELOPMENT: transpile in the browser.
        await loadBabel();
        if (!window.Babel) throw new Error("Babel standalone failed to load from unpkg.com");
        // transpile helper: strip TS, transform JSX; keep ESM so `import` survives.
        const transpile = (source, filename) => window.Babel.transform(source, {
          filename,
          presets: [
            ["typescript", { allExtensions: true, isTSX: true, onlyRemoveTypeImports: true }],
            ["react"],
          ],
        }).code;

        // 1. fetch the engine module, the session store and the UI component in parallel
        //    (no-cache, so all three always come from the same revision).
        const [engRes, storeRes, appRes] = await Promise.all([
          fetch("./engine.tsx", { cache: "no-cache" }),
          fetch("./session-store.js", { cache: "no-cache" }),
          fetch("./TabDecoderPro.tsx", { cache: "no-cache" }),
        ]);
        if (!engRes.ok) throw new Error("fetch engine.tsx → HTTP " + engRes.status);
        if (!storeRes.ok) throw new Error("fetch session-store.js → HTTP " + storeRes.status);
        if (!appRes.ok) throw new Error("fetch TabDecoderPro.tsx → HTTP " + appRes.status);
        const engineSrc = await engRes.text();
        const storeSrc = await storeRes.text();
        let appSrc = await appRes.text();

        // 2. transpile the engine, publish it at a Blob URL, and repoint EVERY
        //    `import ... from "./engine.tsx"` in the UI at that URL (no bundler needed).
        //    session-store.js is plain ES already: published as-is at its own Blob URL.
        const engineUrl = blobUrl(transpile(engineSrc, "engine.tsx"));
        const storeUrl = blobUrl(storeSrc);
        appSrc = appSrc.replace(/from\s*["']\.\/engine\.tsx["']/g, 'from "' + engineUrl + '"');
        appSrc = appSrc.replace(/from\s*["']\.\/session-store\.js["']/g, 'from "' + storeUrl + '"');
        appSrc = appSrc.replace(/from\s*["']react["']/g, 'from "' + blobUrl(reactShim(React)) + '"');
        // Publish the transpiled-engine Blob URL so the app can spin a parse Web
        // Worker that imports the SAME engine module (Roadmap Wave 1 #3). The worker
        // is a progressive enhancement — the app falls back to main-thread parsing
        // if this is absent, so boot never depends on it.
        window.__TTP_ENGINE_URL__ = engineUrl;

        // 3. transpile the UI, load it. engineUrl and storeUrl are left alive: the
        //    UI module's import bindings resolve against them.
        const appUrl = blobUrl(transpile(appSrc, "TabDecoderPro.tsx"));
        ({ default: TabDecoderPro } = await import(appUrl));
        URL.revokeObjectURL(appUrl);
      }

      ReactDOM.createRoot(boot).render(React.createElement(TabDecoderPro));
      splash.remove();
    } catch (err) {
      console.error(err);
      fail("startup error:", err && err.message ? err.message : err);
    }
  </script>
</body>
</html>
