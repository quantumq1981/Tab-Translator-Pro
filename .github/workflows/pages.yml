name: Deploy to GitHub Pages

# Publishes the zero-build static app. The site is just index.html (which
# fetches + transpiles the component in-browser) plus the single-file source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp TabDecoderPro.tsx _site/

      # enablement: true turns Pages on (source = GitHub Actions) using the
      # workflow's `pages: write` permission, so no manual Settings toggle is
      # needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
