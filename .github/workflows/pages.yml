name: Deploy to GitHub Pages

# Publishes the zero-build static app. The site is index.html (which fetches +
# transpiles the source in-browser) plus the two source files it loads at
# runtime: engine.tsx (pure recognition engine) and TabDecoderPro.tsx (React UI).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Headless test harness (tests/) validates the recognition engine + parsers
  # before anything is published. Deploy is gated on this passing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # tests/ has no lockfile (the app itself is zero-dependency), so use
      # `npm install` rather than `npm ci`.
      - name: Install test deps
        run: npm install
        working-directory: tests
      - name: Run tests
        run: npm test
        working-directory: tests

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp engine.tsx _site/
          cp TabDecoderPro.tsx _site/

      # enablement: true turns Pages on (source = GitHub Actions) using the
      # workflow's `pages: write` permission, so no manual Settings toggle is
      # needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
