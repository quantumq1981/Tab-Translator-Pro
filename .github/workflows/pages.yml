name: Deploy to GitHub Pages

# Publishes the zero-build static app. The site is index.html (which fetches +
# transpiles the source in-browser) plus the two source files it loads at
# runtime: engine.tsx (pure recognition engine) and TabDecoderPro.tsx (React UI).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Headless test harness (tests/) validates the recognition engine + parsers
  # before anything is published. Deploy is gated on this passing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # tests/ has no lockfile (the app itself is zero-dependency), so use
      # `npm install` rather than `npm ci`.
      - name: Install test deps
        run: npm install
        working-directory: tests
      - name: Run tests
        run: npm test
        working-directory: tests

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp engine.tsx _site/
          cp TabDecoderPro.tsx _site/
          # Optional ML note-transcription (Spotify basic-pitch). Ships the
          # browser-only inference glue + the vendored TF.js graph model.
          cp note-model.js _site/
          mkdir -p _site/models/basic-pitch
          cp models/basic-pitch/model.json _site/models/basic-pitch/
          cp models/basic-pitch/group1-shard1of1.bin _site/models/basic-pitch/
          cp models/basic-pitch/NOTICE _site/models/basic-pitch/
          # Optional full-mix stem separation (SCNet via the vendored, MIT-licensed
          # @audio/neural-separate bundle; weights fetched at runtime, SHA-256-checked).
          cp stem-model.js stem-model-core.js stem-worker.js _site/
          mkdir -p _site/vendor
          cp vendor/neural-separate.mjs vendor/NOTICE-neural-separate.txt _site/vendor/
          # Low-memory (phone) SCNet: same network, 2.8 s window — served same-origin, SHA-256 pinned
          # in stem-model-core.js (scripts/scnet_reframe.py rebuilds it from the pinned upstream file).
          mkdir -p _site/models/scnet-compact
          cp models/scnet-compact/scnet-f120.int8.onnx models/scnet-compact/NOTICE _site/models/scnet-compact/
          # Stamp the separator's module graph with this commit: stem-model.js?v=<sha> passes the stamp on to
          # stem-worker.js → stem-model-core.js → the vendor bundle, so a phone runs the separator that was
          # deployed instead of a copy its HTTP cache kept (the UI itself is always fetched no-cache).
          BUILD="${GITHUB_SHA::7}"
          sed -i "s#src=\"./stem-model.js\"#src=\"./stem-model.js?v=${BUILD}\"#" _site/index.html
          grep -q "src=\"./stem-model.js?v=${BUILD}\"" _site/index.html

      # enablement: true turns Pages on (source = GitHub Actions) using the
      # workflow's `pages: write` permission, so no manual Settings toggle is
      # needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
